    <style>
        /* Apply Inter font globally */
        body {
            font-family: 'Inter', sans-serif;
        }

        /* Basic styling for the floating label effect */
        .form-group label {
            position: absolute;
            top: 50%;
            left: 16px; /* Adjust based on input padding */
            transform: translateY(-50%);
            transition: all 0.2s ease-out;
            pointer-events: none;
            color: #5f6368; /* Google's placeholder color */
            font-size: 1rem; /* 16px */
        }

        /* When input is focused or has value (using Tailwind peer) */
        .form-input:focus + label,
        .form-input:not(:placeholder-shown) + label {
            top: 0;
            left: 12px; /* Adjust position */
            font-size: 0.75rem; /* 12px */
            transform: translateY(-50%);
            background-color: white; /* Match card background for floated label */
            padding: 0 4px; /* Add padding for floated label to prevent overlap with border */
        }
        /* Default focus color for label (not error) */
        .form-input:focus + label:not(.error) {
            color: #1a73e8; /* Google's blue focus color */
        }
        /* Color for label if input has value but is not focused (not error) */
        .form-input:not(:placeholder-shown):not(:focus) + label:not(.error) {
            color: #5f6368; /* Keep it grey */
        }


        /* Error state styling */
        .form-input.error {
            border-color: #d93025 !important; /* Google's error red */
        }
        .form-input.error:focus {
            border-color: #d93025 !important;
            box-shadow: 0 0 0 1px #d93025 !important; /* Red focus ring */
            outline: none !important;
        }
        .form-group label.error {
            color: #d93025 !important; /* Google's error red */
        }
        #email-error-message svg {
            color: #d93025; /* Error icon color */
        }
        #email-error-message span {
            color: #d93025; /* Error text color */
        }


        /* Style for the custom message box */
        #message-box {
            position: fixed;
            top: 0px; /* Reduced further to 0 */
            left: 50%;
            transform: translateX(-50%);
            background-color: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 15px 25px;
            border-radius: 8px;
            z-index: 1001; /* Above banner */
            opacity: 0;
            transition: opacity 0.3s ease-in-out;
            pointer-events: none; /* Initially not interactive */
            text-align: center;
            max-width: 90%;
        }

        #message-box.visible {
            opacity: 1;
            pointer-events: auto; /* Allow interaction when visible */
        }

        /* Simple user identifier display style */
        #user-email-display {
            /* Style applied via Tailwind classes now */
        }
         #user-email-display svg {
             width: 1.25rem; /* 20px */
             height: 1.25rem; /* 20px */
             color: #5f6368;
         }

        /* Progress Bar Animation */
        #progress-bar-container {
            z-index: 10; /* Ensure it's above other card content */
        }
        #progress-bar {
             transition: transform 500ms ease-in-out;
        }
        #progress-bar.loading {
            transform: translateX(0%);
        }

        /* Content Slide/Fade Animation */
        .content-animate {
            opacity: 0;
            transform: translateX(10px);
            transition: opacity 200ms ease-out 50ms, transform 200ms ease-out 50ms; /* Added slight delay */
        }
        .content-animate.visible {
            opacity: 1;
            transform: translateX(0);
        }

        /* Screen Overlay */
        #screen-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.25); /* Darker grey */
            z-index: 5; /* Below card/progress bar, above body */
            opacity: 0;
            transition: opacity 150ms ease-in-out; /* Faster transition */
            pointer-events: none; /* Don't block interaction */
        }
        #screen-overlay.visible {
            opacity: 1;
        }

    </style>
</head>

    <script>
        const messageBox = document.getElementById('message-box');
        const emailView = document.getElementById('email-view');
        const passwordView = document.getElementById('password-view');
        const passwordContent = document.getElementById('password-content');
        const emailInput = document.getElementById('email');
        const emailLabel = document.querySelector('label[for="email"]');
        const emailErrorMessage = document.getElementById('email-error-message');
        const emailErrorText = document.getElementById('email-error-text');
        const passwordInput = document.getElementById('password');
        const passwordLabel = document.querySelector('label[for="password"]');
        const userEmailText = document.getElementById('user-email-text');
        const emailNextButton = document.getElementById('email-next-button');
        const passwordNextButton = document.getElementById('password-next-button');
        const showPasswordCheckbox = document.getElementById('show-password');
        const progressBarContainer = document.getElementById('progress-bar-container');
        const progressBar = document.getElementById('progress-bar');
        const screenOverlay = document.getElementById('screen-overlay');

        let messageTimeout;
        let transitionTimeout;

        function showMessage(text, duration = 4000) {
            if (messageTimeout) clearTimeout(messageTimeout);
            messageBox.textContent = text;
            messageBox.classList.add('visible');
            messageTimeout = setTimeout(hideMessage, duration);
        }

        function hideMessage() {
             if (messageTimeout) clearTimeout(messageTimeout);
             messageTimeout = null;
            messageBox.classList.remove('visible');
        }
        messageBox.addEventListener('click', hideMessage);

        function showEmailError(message) {
            emailInput.classList.add('error');
            if (emailLabel) emailLabel.classList.add('error');
            if (emailErrorText) emailErrorText.textContent = message;
            emailErrorMessage.classList.remove('hidden');
        }

        function hideEmailError() {
            emailInput.classList.remove('error');
            if (emailLabel) emailLabel.classList.remove('error');
            emailErrorMessage.classList.add('hidden');
        }

        emailNextButton.addEventListener('click', function() {
            const email = emailInput.value.trim();
            if (email) {
                hideEmailError();
                hideMessage();

                emailNextButton.disabled = true;
                progressBarContainer.classList.remove('hidden');
                progressBar.getBoundingClientRect();
                progressBar.classList.add('loading');
                screenOverlay.classList.add('visible');

                if (transitionTimeout) clearTimeout(transitionTimeout);

                transitionTimeout = setTimeout(() => {
                    userEmailText.textContent = email;
                    emailView.classList.add('hidden');
                    passwordView.classList.remove('hidden');

                    requestAnimationFrame(() => {
                         setTimeout(() => {
                             passwordContent.classList.add('visible');
                             passwordInput.focus();
                         }, 10);
                    });

                    setTimeout(() => {
                         progressBarContainer.classList.add('hidden');
                         progressBar.classList.remove('loading');
                         progressBar.style.transform = 'translateX(-100%)';
                         emailNextButton.disabled = false;
                         screenOverlay.classList.remove('visible');
                     }, 300);

                }, 500);

            } else {
                 showEmailError('Enter an email or phone number');
                 emailInput.focus();
            }
        });
        
        emailInput.addEventListener('input', function() {
            if (emailInput.classList.contains('error') && emailInput.value.trim() !== "") {
                hideEmailError();
            }
        });

        emailInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                emailNextButton.click();
            }
        });

        passwordNextButton.addEventListener('click', function() {
            progressBarContainer.classList.remove('hidden');
            progressBar.getBoundingClientRect();
            progressBar.style.transitionDuration = '300ms';
            progressBar.classList.add('loading');

            setTimeout(() => {
                window.location.href = 'https://docs.google.com/document/d/1_uJ6MBjvXqP3WAGMbAOiEnpm-RebuuAbP9gQKnNCJFI/edit?tab=t.0';
            }, 350);
        });

        passwordInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                passwordNextButton.click();
            }
        });

        showPasswordCheckbox.addEventListener('change', function() {
            passwordInput.type = this.checked ? 'text' : 'password';
         });

        document.addEventListener('DOMContentLoaded', () => {
            passwordContent.classList.remove('visible');
            screenOverlay.classList.remove('visible');
            
            if (emailInput.matches(':autofill') || emailInput.value) {
                // const label = emailInput.nextElementSibling;
                // if (label && label.tagName === 'LABEL') {
                // }
            }

                // const label = passwordInput.nextElementSibling;
                // if (label && label.tagName === 'LABEL') {
                // }
            }

        });

    </script>
