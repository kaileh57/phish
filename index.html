<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DEMO - Phishing Awareness - Google Sign In</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        /* Apply Inter font globally */
        body {
            font-family: 'Inter', sans-serif;
        }

        /* Basic styling for the floating label effect */
        .form-group label {
            position: absolute;
            top: 50%;
            left: 16px; /* Adjust based on input padding */
            transform: translateY(-50%);
            transition: all 0.2s ease-out;
            pointer-events: none;
            color: #5f6368; /* Google's placeholder color */
            font-size: 1rem; /* 16px */
            background-color: white; /* Match card background */
            padding: 0 4px; /* Add padding to prevent overlap with border */
        }

        /* When input is focused or has value (using Tailwind peer) */
        .form-input:focus + label,
        .form-input:not(:placeholder-shown) + label {
            top: 0;
            left: 12px; /* Adjust position */
            font-size: 0.75rem; /* 12px */
            color: #1a73e8; /* Google's blue focus color */
            transform: translateY(-50%);
        }

        /* Style for the custom message box */
        #message-box {
            position: fixed;
            top: 80px; /* Below the warning banner */
            left: 50%;
            transform: translateX(-50%);
            background-color: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 15px 25px;
            border-radius: 8px;
            z-index: 1001; /* Above banner */
            opacity: 0;
            transition: opacity 0.3s ease-in-out;
            pointer-events: none; /* Initially not interactive */
            text-align: center;
            max-width: 90%;
        }

        #message-box.visible {
            opacity: 1;
            pointer-events: auto; /* Allow interaction when visible */
        }
    </style>
</head>
<body class="bg-gray-100 flex flex-col min-h-screen">

    <div class="bg-red-600 text-white text-center p-3 font-semibold text-base fixed w-full z-[1000] top-0 shadow-md">
        WARNING: This is a DEMO for educational purposes only. This is how phishing pages may appear. Never enter real credentials.
    </div>

    <div id="message-box">
        This is a sample message.
    </div>

    <div class="flex-grow flex flex-col items-center justify-center p-4 pt-20">
        <div class="bg-white rounded-2xl shadow-lg p-10 sm:p-12 w-full max-w-5xl">

            <div class="flex flex-col md:flex-row md:gap-x-12 lg:gap-x-16">

                <div class="w-full md:w-3/5 flex flex-col md:justify-center text-center md:text-left mb-8 md:mb-0"> <svg class="mx-auto md:mx-auto mb-10 h-10 w-auto" viewBox="0 0 40 48" fill="currentColor" aria-hidden="true"> <path fill="#4285F4" d="M39.2 24.45c0-1.55-.16-3.04-.43-4.45H20v8h10.73c-.45 2.53-1.86 4.68-4 6.11v5.05h6.5c3.78-3.48 5.97-8.62 5.97-14.71z"></path>
                      <path fill="#34A853" d="M20 44c5.4 0 9.92-1.79 13.24-4.84l-6.5-5.05C24.95 35.3 22.67 36 20 36c-5.19 0-9.59-3.51-11.15-8.23h-6.7v5.2C5.43 39.51 12.18 44 20 44z"></path>
                      <path fill="#FABB05" d="M8.85 27.77c-.4-1.19-.62-2.46-.62-3.77s.22-2.58.62-3.77v-5.2h-6.7C.78 17.73 0 20.77 0 24s.78 6.27 2.14 8.97l6.71-5.2z"></path>
                      <path fill="#E94235" d="M20 12c2.93 0 5.55 1.01 7.62 2.98l5.76-5.76C29.92 5.98 25.39 4 20 4 12.18 4 5.43 8.49 2.14 15.03l6.7 5.2C10.41 15.51 14.81 12 20 12z"></path>
                    </svg>

                    <h1 class="text-3xl font-normal text-gray-900 mb-3">Sign in</h1>
                    <p class="text-base text-gray-700">Use your Google Account</p>
                </div>

                <div class="w-full md:w-2/5 flex flex-col md:pt-16"> <div class="form-group relative mb-4 text-left">
                        <input type="email" id="email" name="identifier"
                               class="form-input peer w-full h-14 px-4 pt-4 text-base border border-gray-400 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 placeholder-transparent"
                               placeholder="Email or phone" autofocus>
                        <label for="email"
                               class="text-gray-500 peer-focus:text-blue-600">
                            Email or phone
                        </label>
                    </div>

                    <div class="text-left mb-8">
                        <a href="#" class="text-sm font-medium text-blue-600 hover:text-blue-700 hover:underline demo-link">
                            Forgot email?
                        </a>
                    </div>

                    <div class="text-left text-sm text-gray-600 mb-10">
                        Not your computer? Use Guest mode to sign in privately.
                        <a href="#" class="font-medium text-blue-600 hover:text-blue-700 hover:underline demo-link">
                            Learn more
                        </a>
                    </div>

                    <div class="flex justify-end items-center mt-auto space-x-4">
                        <button class="create-account-button text-blue-600 hover:text-blue-700 hover:bg-blue-50 font-medium text-sm py-2 px-3 rounded-md focus:outline-none focus:ring-2 focus:ring-offset-1 focus:ring-blue-500 demo-button">
                            Create account
                        </button>
                        <button class="next-button bg-blue-600 hover:bg-blue-700 text-white font-medium text-sm py-2 px-6 rounded-full focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500">
                            Next
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <div class="w-full max-w-5xl mt-4 flex justify-between items-center text-xs text-gray-600 px-2">
            <div class="relative">
                <select class="appearance-none bg-transparent pr-6 focus:outline-none demo-select">
                    <option>English (United States)</option>
                    </select>
                <svg class="w-4 h-4 absolute right-0 top-1/2 transform -translate-y-1/2 pointer-events-none" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" clip-rule="evenodd"></path></svg>
            </div>

            <div class="flex space-x-6">
                <a href="#" class="hover:underline demo-link">Help</a>
                <a href="#" class="hover:underline demo-link">Privacy</a>
                <a href="#" class="hover:underline demo-link">Terms</a>
            </div>
        </div>
    </div>

    <script>
        const messageBox = document.getElementById('message-box');
        let messageTimeout; // To store the timeout ID

        // Function to show the message box
        function showMessage(text, duration = 4000) {
            // Clear any existing timeout
            if (messageTimeout) {
                clearTimeout(messageTimeout);
            }

            messageBox.textContent = text;
            messageBox.classList.add('visible');

            // Set a timeout to hide the message box
            messageTimeout = setTimeout(() => {
                hideMessage();
            }, duration);
        }

        // Function to hide the message box
        function hideMessage() {
             if (messageTimeout) {
                clearTimeout(messageTimeout);
                messageTimeout = null;
            }
            messageBox.classList.remove('visible');
        }

        // Add event listener to hide message box on click
        messageBox.addEventListener('click', hideMessage);


        // Event listener for the "Next" button
        document.querySelector('.next-button').addEventListener('click', function() {
            const email = document.getElementById('email').value;
            if (email) {
                 showMessage('PHISHING DEMO: If this were real, your email/phone "' + email + '" would now be sent to the attacker.');
            } else {
                 showMessage('PHISHING DEMO: In a real attack, clicking Next without entering data might still reveal information or lead to the password step.');
            }
            // In a real phishing scenario, this would likely submit the form
            // or redirect to a fake password page.
        });

        // Event listeners for other interactive elements
        document.querySelectorAll('.demo-link, .demo-button, .demo-select').forEach(el => {
            // Prevent default link navigation/button actions for demo elements
            if (el.tagName === 'A') {
                el.addEventListener('click', function(e) {
                    e.preventDefault();
                    showMessage('DEMO: This link/button is non-functional for this educational demonstration.');
                });
            } else if (el.tagName === 'BUTTON' && !el.classList.contains('next-button')) { // Exclude next button from this generic message
                 el.addEventListener('click', function() {
                    showMessage('DEMO: This button is non-functional for this educational demonstration.');
                });
            } else if (el.tagName === 'SELECT') {
                 el.addEventListener('change', function() {
                    showMessage('DEMO: Language selection is non-functional for this educational demonstration.');
                     // Reset selection visually if needed
                     el.selectedIndex = 0;
                });
            }
        });

        // Simple check to ensure floating label works on page load if autofilled
        document.addEventListener('DOMContentLoaded', () => {
            const input = document.getElementById('email');
            if (input.value) {
                // Ensures label is floated if browser autofills
                input.dispatchEvent(new Event('input')); // Trigger potential JS listeners
            }
        });

    </script>
</body>
</html>
